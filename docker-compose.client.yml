services:
  cloudsec-client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
      args:
        PROFILE: ${CLOUDSEC_PROFILE:-training}
    image: cloudsec-client:${CLOUDSEC_PROFILE:-training}
    container_name: cloudsec-client
    env_file: .env.client
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - cloudsec-runs:/data
    restart: unless-stopped
volumes:
  cloudsec-runs:
